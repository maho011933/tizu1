name: CD (Continuous Deployment)

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    name: Build Verification & Cloud Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend Build & Type Check
        run: |
          cd backend
          npm ci
          npm run type-check

      - name: Frontend Lint & Build Check
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

      - name: Trigger Render Deployment (Webhook)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering cloud deployment on Render..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered successfully."

      - name: Trigger Generic Cloud Deploy Webhook
        if: ${{ secrets.GENERIC_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering custom cloud deployment..."
          curl -s -X POST "${{ secrets.GENERIC_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered successfully."
