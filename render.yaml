services:
  # バックエンド API (Express)
  - type: web
    name: tizu-backend-maho
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --include=dev
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tizu-db-maho
          property: connectionString

  # フロントエンド (React / Vite Static Site)
  - type: web
    name: tizu-frontend-maho
    env: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tizu-backend-maho
          property: url

databases:
  # PostgreSQL / PostGIS データベース
  - name: tizu-db-maho
    plan: free
    databaseName: safety_map
    user: safety_user
    region: singapore
