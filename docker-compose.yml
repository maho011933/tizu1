services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: me-safety-map-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safety_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safety_pass}
      POSTGRES_DB: ${POSTGRES_DB:-safety_map}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safety_user} -d ${POSTGRES_DB:-safety_map}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: me-safety-map-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-safety_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-safety_pass}
      - DB_NAME=${POSTGRES_DB:-safety_map}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: me-safety-map-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
